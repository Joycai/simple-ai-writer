name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3). Leave blank to use YY.M.D date stamp.'
        required: false
        type: string

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - id: set-version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date +'%y.%-m.%-d')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: determine-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-targets: ''
            args: ''
            bundle-path: 'src-tauri/target/release/bundle/'
          - platform: windows-latest
            rust-targets: ''
            args: ''
            bundle-path: 'src-tauri/target/release/bundle/'
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
            bundle-path: 'src-tauri/target/developer-id/universal-apple-darwin/release/bundle/'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}

      - name: Clear stale Tauri bundles from cache
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle
          rm -rf src-tauri/target/universal-apple-darwin/release/bundle
          rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle
          rm -rf src-tauri/target/x86_64-apple-darwin/release/bundle
          rm -rf src-tauri/target/developer-id/universal-apple-darwin/release/bundle

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update version in manifests
        shell: bash
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          node .claude/skills/bump-version/scripts/bump-version.mjs "$VERSION" --dry-run
          node .claude/skills/bump-version/scripts/bump-version.mjs "$VERSION"

      # Only the manual release job receives Apple credentials; PR CI never does.
      - name: Prepare macOS notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release secret: $name"
              exit 1
            fi
          done
          umask 077
          key_path="$RUNNER_TEMP/macos-notarization.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: pnpm tauri:macos:release --target universal-apple-darwin

      - name: Remove macOS notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/macos-notarization.p8"

      - name: Build Tauri app (Windows / Linux)
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ matrix.bundle-path }}
          retention-days: 1
          if-no-files-found: error

  create-release:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Organize release files
        shell: bash
        run: |
          mkdir -p release-files

          # Copy only distributable installers. Match *.app.tar.gz (macOS updater
          # bundle) rather than *.tar.gz, which would also sweep up control.tar.gz
          # and data.tar.gz — internal members of the .deb that the Linux bundler
          # leaves in bundle/deb/.
          find dist-artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.app.tar.gz" \) -exec cp {} release-files/ \;

          # List all collected files
          echo "=== Release Files ==="
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Simple AI Writer v${{ needs.determine-version.outputs.version }}'
          tag_name: v${{ needs.determine-version.outputs.version }}
          draft: false
          body: |
            Download the installer for your platform from the assets below.

            | Platform | File |
            | -------- | ---- |
            | macOS (Universal) | `.dmg` |
            | Windows | `.msi` / `.exe` |
            | Linux | `.AppImage` / `.deb` |
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
