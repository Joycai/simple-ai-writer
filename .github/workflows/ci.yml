name: CI

# Pull-request quality gate. Every PR targeting `main` must pass this workflow
# before it can be merged (enforce via branch protection — see docs/reference/ci.md).
# Also runs on pushes to `main` so the default branch always has a status.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. when new commits are pushed to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Most PRs here are frontend-only. The Rust job costs ~2-3 minutes of which
  # almost all is setup (apt install of the webkit dev tree + restoring the
  # cargo cache) — none of it tells us anything when no Rust file moved. Gate
  # the job on the diff instead; `ci-success` below treats a skip as a pass.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      - name: Test (vitest)
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  rust:
    name: Backend (fmt, clippy, test, build)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4

      # Only what `cargo build` needs to *link*, not what `tauri build` needs to
      # *bundle*. This job never produces an AppImage/deb, so `librsvg2-dev` and
      # `patchelf` (bundler-only) are deliberately absent — release.yml keeps them.
      # `libappindicator3-dev` is gone too: the `libappindicator` crate is not in
      # the linux dependency graph at all (no tray icon in this app), verified with
      #   cargo tree --target x86_64-unknown-linux-gnu -e normal -i libappindicator
      # `libdbus-1-dev` stays — `libdbus-sys` *is* in the graph, via tao -> dbus.
      #
      # Cached rather than apt-fetched because this step's problem is its *tail*,
      # not its average: across 40 successful runs it took a 33 s median but 78 /
      # 165 / 445 s at the top end, since it pulls from the public Ubuntu mirrors.
      # Restoring from the Actions cache trades that for GitHub's own infra. On a
      # cache miss the action just runs apt itself, i.e. today's behaviour.
      # Bump `version:` to force a rebuild of the cache.
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libdbus-1-dev
          version: 1
          execute_install_scripts: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ci

      - name: Format check (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (cargo test)
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Build (cargo build)
        working-directory: src-tauri
        run: cargo build --locked

  # The knowledge-base sync server (server/). A plain axum binary — no webview,
  # no Tauri — so it shares nothing with the `rust` job above: no apt step, its
  # own cargo cache, and it is gated on its own paths. Keeping them separate is
  # what lets a server-only PR finish in well under a minute.
  server:
    name: Sync server (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './server -> target'
          shared-key: server

      - name: Format check (cargo fmt)
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Lint (cargo clippy)
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (cargo test)
        working-directory: server
        run: cargo test --all-features

      - name: Build (cargo build)
        working-directory: server
        run: cargo build --locked

  # Single check to require in branch protection — succeeds only if all jobs above pass.
  ci-success:
    name: CI Success
    if: always()
    needs: [changes, frontend, rust, server]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          fail=0
          [ "${{ needs.changes.result }}" = "success" ] || fail=1
          [ "${{ needs.frontend.result }}" = "success" ] || fail=1
          # `skipped` is a pass for the two conditional jobs: the diff touched
          # no file they are gated on.
          case "${{ needs.rust.result }}" in
            success|skipped) ;;
            *) fail=1 ;;
          esac
          case "${{ needs.server.result }}" in
            success|skipped) ;;
            *) fail=1 ;;
          esac
          if [ "$fail" != "0" ]; then
            echo "One or more CI jobs failed."
            echo "  changes=${{ needs.changes.result }}"
            echo "  frontend=${{ needs.frontend.result }}"
            echo "  rust=${{ needs.rust.result }}"
            echo "  server=${{ needs.server.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
