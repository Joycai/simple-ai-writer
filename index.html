<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple AI Writer</title>
    <!-- Fonts are self-hosted and bundled (src/styles/fonts.ts, Fontsource) —
         no network request, no render blocking, works fully offline. -->
    <!-- Minimal splash shown until React mounts (createRoot().render replaces
         #root's children). Mainly visible during vite dev's first compile. -->
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f7f5f0;
        color: #8a8577;
        font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.08em;
      }
      @media (prefers-color-scheme: dark) {
        .boot-splash { background: #191713; color: #7d776a; }
      }
      .boot-splash-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-spinner"></div>
        <div>Simple AI Writer</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
