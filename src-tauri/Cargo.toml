[package]
name = "simple-ai-writer"
version = "1.43.0"
description = "Simple AI Writer"
authors = ["joycai"]
edition = "2021"

[lib]
name = "simple_ai_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# `unsafe-headers` is what lets the frontend set an Origin header (src/lib/http.ts
# rewrites it for local model servers). Without it the plugin silently drops every
# "forbidden" header per the fetch spec and then appends the webview's own origin —
# on Windows that is `http://tauri.localhost`, which Ollama's default allowlist
# rejects with a 403. With the feature on, the plugin only supplies an Origin when
# the caller didn't, so every other request is unaffected. Origin is the sole
# forbidden header this app sets; keep it that way (Host/Content-Length/Cookie &c.
# now pass through unchecked).
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# System notifications (需要审批 / 执行完成), gated behind a settings switch —
# see `src/lib/notify.ts`. Desktop `request_permission` always answers Granted:
# the OS-level authorization is macOS's own, granted implicitly the first time a
# *bundled* app posts one. Under `tauri dev` the plugin deliberately posts as
# `com.apple.Terminal` on macOS and without an AppUserModelID on Windows, so a
# dev-mode notification wears the terminal's name and icon — only an installed
# build shows this app's.
tauri-plugin-notification = "2"
# The same sqlx `tauri-plugin-sql` is built on, declared directly for `sqltx.rs`.
# The plugin only ever hands the frontend a connection *pool*, so a BEGIN/COMMIT
# pair issued as two `db.execute()` calls is not one transaction — see the module
# doc comment. `sqltx.rs` opens its own connection to get a real one; the version
# and feature set match the plugin's so cargo unifies them into one build.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v4 split the API into keyring-core and each credential store into its own
# crate, so the v3 backend features (apple-native / windows-native /
# sync-secret-service) no longer exist. The default `v1` feature is the
# compatibility layer: it keeps the same Entry/Error API and wires up the
# macOS Keychain, Windows Credential Manager and Secret Service automatically
# on first Entry::new, which is all secrets.rs needs.
keyring = "4"
# Lore bundle export/import. Default features pull in bzip2/zstd/aes backends
# we never produce or accept — deflate is the only method our bundles use.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Content hashing for knowledge-base sync (`lorehash.rs`). The digest it
# produces is a wire format shared with the sync server, so this is a real
# dependency of the protocol, not an implementation detail.
sha2 = "0.10"
# `device_label` — the machine name shown as "last written by" in knowledge-base
# sync. std has no portable hostname call; this is a ~50-line shim over the
# platform APIs with no dependencies of its own.
gethostname = "1"
# .xlsx import (see xlsx.rs). `chrono` is what turns a date cell into a real
# date instead of the raw serial number Excel stores it as — without it every
# date in an imported sheet reads as "45678".
calamine = { version = "0.36", features = ["chrono"] }
# .xlsx export (see xlsx_write.rs). Already in the tree as a dev-dependency —
# it builds the workbooks the import tests read back — so the write side is a
# promotion rather than a new name. Generating in Rust is right here and wrong
# for .docx: nothing markdown crosses the IPC boundary, only a grid whose cell
# types the frontend has already settled.
rust_xlsxwriter = "0.97"
# .pptx import + the agent's paged slide reader (see pptx.rs). Already in the
# tree under calamine at this version, so declaring it directly adds a name to
# this file and nothing to the build.
quick-xml = "0.41"
# Binary file writes cross the IPC boundary as base64 rather than a JSON array
# of numbers — see `fs_write_binary_file`.
base64 = "0.22"
# Text-encoding guessing for `fs_read_text_file` (see `decode_text` in
# commands.rs). A file the author drops into the workspace is as likely GBK
# (Chinese Windows) or Shift_JIS as UTF-8; before this, anything non-UTF-8 was
# a hard read error. chardetng is Firefox's detector, encoding_rs its decoder —
# both already proven on exactly this problem, and encoding_rs is in the tree
# transitively anyway.
encoding_rs = "0.8"
chardetng = "0.1"

# instance.rs asks the OS whether a workspace lock's holder PID is still alive
# (the advisory multi-open guard). std has no process-liveness call; both
# probes below are one syscall over crates already in the tree transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading"] }

# print.rs runs its own NSPrintOperation instead of wry's `print()`, because
# wry zeroes all four margins on the *shared* NSPrintInfo (wry 0.55 wkwebview
# print_with_options) — the saved PDF has text flush against the paper edge and
# the process-wide print defaults are left mutated. Every crate below is
# already in the tree via wry at these versions; the features gate the exact
# APIs used: margin setters (app-kit `objc2-core-foundation`), NSPrintOperation
# + runOperationModalForWindow (`NSPrintOperation`/`NSResponder`/`NSWindow`),
# WKWebView::printOperationWithPrintInfo (web-kit `objc2-app-kit`), and
# NSCopying (foundation `NSObject`).
[target.'cfg(target_os = "macos")'.dependencies]
# `secrets.rs` keeps every secret in one keychain item and folds the old
# per-provider items into it on first use. Enumerating those leftovers needs
# `Entry::search`, which the `keyring` v1 compatibility wrapper doesn't
# re-export — it lives on `keyring_core::Entry`. Same 1.x `keyring` itself
# depends on, so cargo unifies them into one crate.
keyring-core = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSResponder",
    "NSWindow",
    "NSPrintInfo",
    "NSPrintOperation",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

[dev-dependencies]
# Scratch entry directories for the `lorehash.rs` tests — the hash is defined by
# what is on disk, so the tests have to put things there.
tempfile = "3"
# `tauri::test::mock_app`, so scope.rs can assert what `tauri-plugin-fs`'s own
# glob scope actually allows — the leading-dot rule there is invisible in our
# code and cost a release to find (see docs/image-generation-plan.md §8).
tauri = { version = "2", features = ["test"] }
# `#[tokio::test]` for the sqltx.rs transaction tests — sqlx's async API needs a
# runtime, and every other test in the tree is synchronous.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
