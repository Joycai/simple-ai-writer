[package]
name = "aiw-kb-server"
version = "0.1.0"
description = "Knowledge-base backup/sync server for Simple AI Writer"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "aiw-kb-server"
path = "src/main.rs"

# Windows tray launcher. On any other platform this compiles as a stub that
# prints an explanation and exits — which is what lets the ubuntu CI job's
# `clippy --all-targets` still cover the file.
[[bin]]
name = "aiw-kb-tray"
path = "src/bin/tray.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
getrandom = "0.2"
tar = "0.4"
flate2 = "1"
toml_edit = { version = "0.22", features = ["serde"] }
fs2 = "0.4"
tokio-util = { version = "0.7", features = ["io", "io-util"] }

# Only for two facts the standard library does not expose: the effective uid
# (the health check's "not running as root") and the config file's mode.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The tray launcher (src/bin/tray.rs) only. None of this compiles anywhere else,
# so the headless Linux/NAS builds stay exactly as lean as before.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
tao = "0.30"
rfd = "0.15"
winreg = "0.52"
open = "5"
tracing-appender = "0.2"
# Only for `GetSystemMetrics(SM_CXSMICON)` — the size the shell draws a tray
# icon at, so the glyph frame drawn for that DPI is the one that gets loaded.
# Same version as tray-icon's own copy, so it costs nothing to compile.
windows-sys = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging"] }

# build.rs only: embeds icons/*.ico and a VERSIONINFO block into the two exes.
# Host-gated, so the ubuntu CI job never fetches or compiles it.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
